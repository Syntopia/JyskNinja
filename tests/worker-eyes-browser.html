<!doctype html><html><head><title>Worker eye inspection</title><style>body{margin:0;background:#222;color:white}#ui{position:absolute;top:0}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../docs/vendor/three/build/three.module.js","three/addons/":"../docs/vendor/three/addons/"}}</script></head><body><div id="ui"><button id="male">Carpenter</button><button id="female">Female worker</button><button id="crowd">Instanced crowd</button><button id="walk">Walk</button><button id="death">Death</button><pre id="status"></pre></div><script type="module">
import * as T from 'three';import {createCivilianCrowd} from '../docs/src/civilian-crowd.js?v=3';import {GLTFLoader} from '../docs/src/asset-loader.js?eyes=3';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(devicePixelRatio);r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#353945');const c=new T.PerspectiveCamera(30,innerWidth/innerHeight,.01,20);s.add(new T.HemisphereLight(0xffffff,0x808090,2));const l=new T.DirectionalLight(0xffffff,3);l.position.set(-2,3,4);s.add(l);let g,mixer,crowd,clock=new T.Clock();
async function load(id){if(crowd){crowd.dispose();crowd=null;}if(g)s.remove(g.scene);g=await new GLTFLoader().loadAsync('../docs/assets/'+id+'/retargeted.glb');s.add(g.scene);mixer=new T.AnimationMixer(g.scene);let y=id==='craftsman'?1.67:1.59;c.position.set(.02,y,0.8);c.lookAt(0,y,.04);document.querySelector('#status').textContent=id+' loaded; eyes: '+Boolean(g.scene.getObjectByName('Worker eyes'));}
r.domElement.onclick=e=>{const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),c);const hit=ray.intersectObject(g.scene,true)[0];if(hit)document.querySelector('#status').textContent=JSON.stringify({world:hit.point.toArray(),head:g.scene.getObjectByName('head').worldToLocal(hit.point.clone()).toArray()})};
document.querySelector('#crowd').onclick=async()=>{if(g)s.remove(g.scene);mixer=null;const assets=await Promise.all(['craftsman','female-worker'].map(async id=>({id,gltf:await new GLTFLoader().loadAsync('../docs/assets/'+id+'/retargeted.glb')})));crowd=createCivilianCrowd(assets,{count:2,minZ:-10,maxZ:10});crowd.flock.agents.forEach((a,i)=>Object.assign(a,{x:i*.4-.2,z:0,yaw:0,scale:1,phase:0}));crowd.update({x:0,z:0});s.add(crowd.mesh);c.position.set(0,1.64,2.8);c.lookAt(0,1.64,0);document.querySelector('#status').textContent=JSON.stringify(crowd.stats);};
document.querySelector('#male').onclick=()=>load('craftsman');document.querySelector('#female').onclick=()=>load('female-worker');for(const id of ['walk','death'])document.getElementById(id).onclick=()=>{if(crowd){for(const a of crowd.flock.agents){a.alive=id!=='death';a.deathTime=0}return;}mixer.stopAllAction();mixer.clipAction(g.animations.find(c=>c.name===id)).play()};await load('craftsman');r.setAnimationLoop(()=>{const dt=clock.getDelta();mixer?.update(dt);if(crowd){for(const a of crowd.flock.agents){a.phase=(a.phase+dt*.5)%1;if(!a.alive)a.deathTime+=dt;}crowd.update({x:0,z:0})}r.render(s,c)});
</script></body></html>
